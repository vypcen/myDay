<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Приложение не обращается ни к каким внешним серверам: это гарантирует политика ниже. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob: data:; font-src 'self'; connect-src 'self' blob: data:; worker-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>myDay</title>
<meta name="description" content="Календарь со свободным холстом для каждого дня. Все данные хранятся только на вашем устройстве.">
<meta name="theme-color" content="#f3f4f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10121b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="myDay">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
<style id="themeVars"></style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="month"><h1 id="mName">Октябрь</h1><span class="yr" id="mYear">2026</span></div>
    <div class="nav">
      <span class="hint" id="modeHint"></span>
      <button class="btn icon" id="srchOpen" aria-label="Поиск" title="Поиск (Ctrl+K или /)">⌕</button>
      <button class="btn icon" id="tasksOpen" aria-label="Незавершённые задачи" title="Незавершённые задачи">☑</button>
      <button class="btn icon" id="lockNow" aria-label="Заблокировать" title="Заблокировать" hidden>🔒</button>
      <button class="btn bkbtn" id="bkOpen" title="Данные и бэкап"><span class="bdot"></span>Бэкап</button>
      <button class="btn icon aa" id="setOpen" aria-label="Оформление" title="Оформление">Аа</button>
      <button class="btn icon" id="prev" aria-label="Предыдущий месяц">‹</button>
      <button class="btn" id="today">Сегодня</button>
      <button class="btn icon" id="next" aria-label="Следующий месяц">›</button>
    </div>
  </header>
  <div class="banner" id="banner" hidden role="status"></div>
  <div class="memo" id="memo" hidden></div>
  <section class="cal" aria-label="Календарь">
    <div class="wk"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>
    <div class="grid" id="grid"></div>
  </section>
</div>

<div class="ws" id="ws" hidden role="dialog" aria-modal="true" aria-label="Рабочее пространство дня">
  <div class="wsbar">
    <button class="btn" id="back">←<span class="backlbl"> Календарь</span></button>
    <div class="wshead">
      <span class="wsdate" id="wsDate"></span>
      <input class="wstitle" id="wsTitle" placeholder="Название дня" aria-label="Название дня">
    </div>
    <button class="btn daybtn" id="dayBtn" aria-label="Настроение, цвет дня и привычки" title="Настроение, цвет дня и привычки">☺</button>
    <span class="status" id="status"></span>
    <button class="btn icon" id="srchOpen2" aria-label="Поиск" title="Поиск (Ctrl+K или /)">⌕</button>
    <button class="btn icon bkbtn" id="bkOpen2" aria-label="Данные и бэкап" title="Данные и бэкап"><span class="bdot"></span>⛁</button>
    <button class="btn icon aa" id="setOpen2" aria-label="Оформление" title="Оформление">Аа</button>
    <button class="btn icon" id="dPrev" aria-label="Предыдущий день">‹</button>
    <button class="btn icon" id="dNext" aria-label="Следующий день">›</button>
    <button class="btn icon" id="wsMore" aria-label="Ещё" title="Ещё">⋯</button>
  </div>
  <div class="board" id="board">
    <div class="plane" id="plane"></div>
    <div class="dock">
      <div class="grp">
        <button id="lyrBtn" aria-label="Слои" title="Слои (L)">☰</button>
        <button id="selBtn" aria-label="Выделение рамкой" title="Выделение рамкой (V или Shift + перетаскивание)">⬚</button>
        <button id="drawBtn" aria-label="Рисование" title="Рисование (P)">✎</button>
      </div>
      <div class="grp">
        <button id="undoBtn" aria-label="Отменить" title="Отменить (Ctrl+Z)" disabled>↶</button>
        <button id="redoBtn" aria-label="Повторить" title="Повторить (Ctrl+Shift+Z)" disabled>↷</button>
      </div>
      <div class="grp zgrp">
        <button id="zOut" aria-label="Уменьшить">−</button>
        <button id="zoomv" aria-label="Масштаб 100%">100%</button>
        <button id="zIn" aria-label="Увеличить">+</button>
        <button id="zFit" aria-label="Показать всё" title="Показать всё">⤢</button>
      </div>
      <button class="fab" id="fab" aria-label="Добавить">+</button>
    </div>
  </div>
</div>
<input type="file" id="fileIn" multiple class="sr" tabindex="-1" aria-hidden="true">
<input type="file" id="audioIn" multiple accept="audio/*,.mp3,.m4a,.wav,.ogg,.oga,.opus,.aac,.flac" class="sr" tabindex="-1" aria-hidden="true">
<input type="file" id="camIn" accept="image/*" capture="environment" class="sr" tabindex="-1" aria-hidden="true">
<input type="file" id="stickIn" accept="image/*,.heic,.heif" class="sr" tabindex="-1" aria-hidden="true">
<div class="lock" id="lock" hidden>
  <form class="lockbox" id="lockForm" autocomplete="off">
    <img src="icons/icon.svg" alt="" width="56" height="56">
    <h2>myDay</h2>
    <p id="lockMsg">Введите PIN-код</p>
    <input class="inp" id="lockIn" type="password" autocomplete="current-password" aria-label="PIN-код">
    <button class="btn primary" type="submit" id="lockGo">Открыть</button>
    <button class="btn" type="button" id="lockBio" hidden>Войти по Face ID / Touch ID</button>
    <p class="bkerr" id="lockErr" role="alert"></p>
    <button type="button" class="linkbtn" id="lockForgot">Забыли код?</button>
    <div class="lockreset" id="lockReset" hidden>
      <p>Код не хранится нигде, поэтому восстановить его нельзя. Можно стереть приложение на этом устройстве и вернуть данные из бэкапа — он открывается своим паролем бэкапа.</p>
      <input class="inp" id="wipeIn" placeholder="Введите СТЕРЕТЬ" autocomplete="off" aria-label="Подтверждение: введите СТЕРЕТЬ">
      <button class="btn danger" type="button" id="lockWipe">Стереть все данные на устройстве</button>
    </div>
  </form>
</div>
<div class="drop" id="drop" hidden>Отпустите — файл встанет сюда</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
