<title>Тетрадь дней</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Manrope:wght@400;600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@500;700&family=Cormorant+Garamond:wght@500;600;700&family=Yeseva+One&family=Comfortaa:wght@400;600;700&family=Caveat:wght@500;700&family=Marck+Script&family=Amatic+SC:wght@400;700&display=swap">
<style>
/* Layout: month grid fills the screen; a day opens as an endless dotted canvas you pan and arrange freely */
/* Base palette = "Кобальт". The viewer's chosen palette is written into #themeVars at runtime;
   derived tones (lines, muted text, soft accent) are mixed from the five base colors so every palette stays coherent. */
:root{
  --paper:#f3f4f9; --sheet:#ffffff; --ink:#15182a; --accent:#3245d1; --on-accent:#ffffff; --mark:#ffe169; --on-mark:#1f1a00;
  --danger:#c0392b; --shadow:rgba(20,24,60,.08);
  --n-y:#fff6c9; --n-b:#e3ecff; --n-g:#ddf4e4; --n-p:#fde4ee;
  --muted:color-mix(in srgb,var(--ink) 62%,var(--sheet));
  --line:color-mix(in srgb,var(--ink) 13%,var(--sheet));
  --accent-soft:color-mix(in srgb,var(--accent) 14%,var(--sheet));
  --weekend:color-mix(in srgb,var(--ink) 3.5%,var(--sheet));
  --dot:color-mix(in srgb,var(--ink) 22%,var(--paper));
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif; --k-display:1;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif; --k-body:1;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10121b; --sheet:#1a1d2a; --ink:#e7e9f3; --accent:#8292ff; --on-accent:#10121b; --mark:#e9c94b;
  --danger:#ef6b5b; --shadow:rgba(0,0,0,.35);
  --n-y:#3b3720; --n-b:#1f2a47; --n-g:#1c3428; --n-p:#3a2230; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#10121b; --sheet:#1a1d2a; --ink:#e7e9f3; --accent:#8292ff; --on-accent:#10121b; --mark:#e9c94b;
  --danger:#ef6b5b; --shadow:rgba(0,0,0,.35);
  --n-y:#3b3720; --n-b:#1f2a47; --n-g:#1c3428; --n-p:#3a2230; color-scheme:dark }

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:calc(15px * var(--k-body))/1.5 var(--f-body);transition:background .25s,color .25s;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:flex;flex-direction:column;height:100%;max-width:1240px;margin:0 auto;padding-block:20px 16px;gap:14px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.month{display:flex;align-items:baseline;gap:12px;min-width:0}
.month h1{margin:0;font:700 calc(clamp(28px,5vw,46px) * var(--k-display))/1.05 var(--f-display);letter-spacing:-.01em}
.month .yr{font:600 15px var(--f-mono);color:var(--muted)}
.nav{display:flex;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:7px 12px;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.icon{width:36px;height:36px;padding:0;display:grid;place-items:center;font-size:18px;flex:none}
.hint{font-size:13px;color:var(--muted)}

.cal{flex:1;min-height:0;display:grid;grid-template-rows:auto 1fr;border:1px solid var(--line);border-radius:14px;background:var(--sheet);overflow:hidden}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line)}
.wk span{padding:8px 10px;font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(6,minmax(84px,1fr))}
.cell{position:relative;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent;text-align:left;
  padding:8px 9px;display:flex;flex-direction:column;gap:4px;min-width:0;overflow:hidden;transition:background .12s}
.cell:nth-child(7n){border-right:0}
.cell:nth-last-child(-n+7){border-bottom:0}
.cell.we{background:var(--weekend)}
.cell:hover{background:var(--accent-soft)}
.cell.out .num,.cell.out .peek{opacity:.4}
.num{font:600 14px var(--f-mono);font-variant-numeric:tabular-nums;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;margin:-3px 0 0 -4px}
.cell.today .num{background:var(--mark);color:var(--on-mark)}
.peek{font-size:12.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;padding-right:38px}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto}
.chip{font:500 10.5px var(--f-mono);padding:1px 6px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.thumb{position:absolute;right:7px;top:7px;width:34px;height:34px;border-radius:6px;object-fit:cover;border:1px solid var(--line)}
@media (max-width:640px){
  .grid{grid-template-rows:repeat(6,minmax(58px,1fr))}
  .peek,.chips,.thumb{display:none}
  .cell{align-items:center;padding:6px 2px}
  .num{margin:0}
  .cell.filled::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:2px}
}

/* ----- workspace ----- */
.ws{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--paper)}
.wsbar{flex:none;background:var(--paper);border-bottom:1px solid var(--line);z-index:3;
  padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:10px}
.wshead{flex:1;min-width:0;display:flex;flex-direction:column}
.wsdate{font:600 11.5px var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.wstitle{width:100%;border:0;background:transparent;font:600 calc(18px * var(--k-display))/1.3 var(--f-display);color:var(--ink);padding:0;outline:none}
.wstitle::placeholder{color:var(--muted);opacity:.7}
.status{font-size:12px;color:var(--muted);white-space:nowrap}
.status.err{color:var(--danger)}
@media (max-width:640px){.status{display:none}.backlbl{display:none}}

.board{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;
  background-repeat:repeat}
.board.panning{cursor:grabbing}
.plane{position:absolute;left:0;top:0;transform-origin:0 0;width:0;height:0}
.bignum{position:absolute;left:0;top:-150px;font:700 calc(120px * var(--k-display))/1 var(--f-display);letter-spacing:-.05em;color:var(--accent);opacity:.12;white-space:nowrap;pointer-events:none}

.it{position:absolute;background:var(--sheet);border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 10px var(--shadow);cursor:default;user-select:text;-webkit-user-select:text}
.it.c-y{background:var(--n-y)} .it.c-b{background:var(--n-b)} .it.c-g{background:var(--n-g)} .it.c-p{background:var(--n-p)}
.it.sel{outline:2px solid var(--accent);outline-offset:1px}
.it.drag{box-shadow:0 12px 30px var(--shadow);cursor:grabbing}
.grip{height:18px;cursor:grab;border-radius:10px 10px 0 0;display:flex;align-items:center;justify-content:space-between;padding:0 8px;
  font:600 9.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);user-select:none;-webkit-user-select:none}
.grip::after{content:"";width:22px;height:6px;background:radial-gradient(var(--muted) 1px,transparent 1.4px) 0 0/5.5px 3px;opacity:.6}
.body{padding:2px 14px 12px;font-family:var(--nf,var(--f-body));font-size:calc(var(--ns,15px) * var(--nk,var(--k-body)))}
.rz{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;opacity:0;
  background:linear-gradient(135deg,transparent 55%,var(--muted) 55%,var(--muted) 62%,transparent 62%,transparent 72%,var(--muted) 72%,var(--muted) 79%,transparent 79%)}
.it:hover .rz,.it.sel .rz{opacity:.7}
@media (hover:none){.rz{opacity:.6}}
textarea.txt{display:block;width:100%;border:0;resize:none;background:transparent;color:var(--ink);font:inherit;line-height:1.5;outline:none;padding:0;min-height:3.2em;overflow:hidden}
.todo{display:flex;flex-direction:column;gap:2px}
.ti{display:flex;align-items:center;gap:9px}
.ti input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);flex:none;margin:0}
.ti input[type=text]{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;padding:3px 0;outline:none}
.ti.done input[type=text]{text-decoration:line-through;color:var(--muted)}
.ti .x{border:0;background:none;color:var(--muted);opacity:0;font-size:13px;padding:0 2px}
.ti:hover .x{opacity:.7}
.addi{border:0;background:none;color:var(--accent);padding:4px 0 0;text-align:left;font-size:14px;align-self:flex-start}
.imgw{padding:6px;cursor:grab}
.imgw img{display:block;width:100%;border-radius:6px;pointer-events:none;-webkit-user-drag:none}
.cap{width:100%;border:0;background:transparent;color:var(--muted);font:13px var(--f-body);padding:6px 4px 0;outline:none}
.filew{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:grab}
.ext{flex:none;width:42px;height:50px;border-radius:5px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 10.5px var(--f-mono);text-transform:uppercase;clip-path:polygon(0 0,70% 0,100% 22%,100% 100%,0 100%)}
.fmeta{min-width:0;flex:1}
.fname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fsize{font:12px var(--f-mono);color:var(--muted)}
.fact{display:flex;gap:10px;margin-top:2px}
.fact button,.fact a{border:0;background:none;padding:0;color:var(--accent);font-size:13px;text-decoration:none}
.uploading{opacity:.65}
.uploading::after{content:"Загружаю…";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--ink);color:var(--paper);font-size:12px;padding:3px 9px;border-radius:99px}
.note{font-size:11.5px;color:var(--muted);padding:4px 6px 2px}

.bhint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:var(--muted);pointer-events:none;max-width:min(420px,calc(100% - 32px));
  background:color-mix(in srgb,var(--paper) 80%,transparent);padding:18px 20px;border-radius:14px;border:1.5px dashed var(--line)}
.bhint strong{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.bhint ul{margin:0;padding:0;list-style:none;font-size:13.5px;line-height:1.8}
.bhint kbd{font:600 11.5px var(--f-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--sheet)}

.dock{position:absolute;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;align-items:center;z-index:2}
.dock .grp{display:flex;align-items:center;background:var(--sheet);border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 10px var(--shadow)}
.dock .grp button{border:0;background:none;height:38px;min-width:38px;padding:0 8px;font-size:16px}
.dock .grp button:hover{color:var(--accent)}
#zoomv{font:600 12px var(--f-mono);min-width:54px}
.fab{width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);font-size:24px;box-shadow:0 6px 18px var(--shadow)}

.ctx{position:fixed;z-index:60;min-width:220px;background:var(--sheet);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 40px var(--shadow);padding:5px;display:flex;flex-direction:column}
.ctx button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:6px;display:flex;gap:10px;align-items:center;font-size:14px}
.ctx button:hover,.ctx button:focus-visible{background:var(--accent-soft);outline:none}
.ctx button .ic{width:18px;text-align:center;font:600 13px var(--f-mono);color:var(--accent)}
.ctx button.danger{color:var(--danger)} .ctx button.danger .ic{color:var(--danger)}
.ctx hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.swatches{display:flex;gap:6px;padding:6px 10px}
.swatches button{width:22px;height:22px;padding:0;border-radius:50%;border:1px solid var(--line)}
.swatches button.on{outline:2px solid var(--accent);outline-offset:1px}

.drop{position:fixed;inset:12px;z-index:30;border:2.5px dashed var(--accent);border-radius:18px;background:color-mix(in srgb,var(--accent-soft) 70%,transparent);
  display:grid;place-items:center;font:700 20px var(--f-display);color:var(--accent);pointer-events:none}
.lb{position:fixed;inset:0;z-index:70;background:rgba(8,9,15,.88);display:grid;place-items:center;padding:24px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--paper);
  padding:10px 14px;border-radius:10px;font-size:14px;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 8px 30px var(--shadow)}
.toast button{border:0;background:none;color:var(--mark);font-weight:600;padding:0;white-space:nowrap}
.btn.icon.aa{font:600 15px var(--f-display);}
/* audio card */
.audw{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:grab}
.play{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);font-size:15px;display:grid;place-items:center;padding:0}
.play[disabled]{opacity:.5;cursor:progress}
.ameta{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.wave{display:flex;align-items:center;gap:2px;height:30px;cursor:pointer}
.wave span{flex:1;min-width:1px;border-radius:2px;background:var(--line);transition:background .1s}
.wave span.on{background:var(--accent)}
.arow{display:flex;justify-content:space-between;gap:8px;font:11.5px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.arow .an{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--f-body);font-size:12.5px;color:var(--ink)}
/* menu: fonts & sizes */
.ctx{max-height:calc(100vh - 16px);overflow-y:auto}
.mlabel{font:600 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 10px 2px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:2px 4px}
.ctx .fgrid button{padding:6px 8px;font-size:15px;white-space:nowrap;overflow:hidden}
.ctx .fgrid button.on,.sizes button.on{background:var(--accent-soft);color:var(--accent)}
.sizes{display:flex;gap:2px;padding:2px 4px}
.ctx .sizes button{flex:1;justify-content:center;padding:6px 0;font:600 12px var(--f-mono)}
/* appearance panel */
.set{position:fixed;top:0;right:0;bottom:0;z-index:66;width:min(390px,100%);background:var(--sheet);border-left:1px solid var(--line);box-shadow:-20px 0 50px var(--shadow);
  overflow-y:auto;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px;animation:slide .2s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.set{animation:none}}
.sethead{display:flex;align-items:center;justify-content:space-between}
.sethead h2{margin:0;font:700 calc(22px * var(--k-display))/1.1 var(--f-display)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h3{margin:0;font:600 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pals{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.pal{border:1px solid var(--line);border-radius:10px;background:var(--sheet);padding:6px;display:flex;flex-direction:column;gap:6px;text-align:left}
.pal.on{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.pal .sw{display:flex;height:40px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.pal .sw i{flex:1;position:relative}
.pal .sw i b{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%}
.pal .sw i s{position:absolute;right:5px;bottom:5px;width:6px;height:6px;border-radius:50%}
.pal span{font-size:12.5px;font-weight:500;padding:0 2px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:6px;padding:7px 4px;font-size:13px}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.accrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.accrow input[type=color]{width:44px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);padding:2px;cursor:pointer}
.accrow .dots{display:flex;gap:6px;flex-wrap:wrap}
.accrow .dots button{width:24px;height:24px;border-radius:50%;border:2px solid var(--sheet);box-shadow:0 0 0 1px var(--line);padding:0}
.accrow .dots button.on{box-shadow:0 0 0 2px var(--ink)}
.fonts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fopt{border:1px solid var(--line);border-radius:9px;background:var(--sheet);padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.fopt.on{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.fopt .smp{font-size:20px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fopt .fn{font:11px var(--f-mono);color:var(--muted)}
.it.locked .grip,.it.locked .imgw,.it.locked .filew,.it.locked .audw{cursor:default}
.it.locked .rz{display:none}
.lockb{position:absolute;top:-9px;right:-9px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:10px;pointer-events:none}
.dock .grp button.on{color:var(--accent);background:var(--accent-soft)}
.layers{position:absolute;left:calc(16px + env(safe-area-inset-left,0px));top:16px;z-index:2;width:min(290px,calc(100% - 32px));max-height:calc(100% - 100px);
  display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px var(--shadow);cursor:default;user-select:none}
.lhead{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px}
.lhead b{font:600 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lhead button{border:0;background:none;color:var(--muted);font-size:14px;width:26px;height:26px;border-radius:6px}
.lhead button:hover{background:var(--accent-soft);color:var(--accent)}
.lnote{font:11px var(--f-mono);color:var(--muted);padding:0 12px 4px;display:flex;justify-content:space-between}
.llist{list-style:none;margin:0;padding:4px 6px 8px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.lrow{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:7px;cursor:grab;border:1px solid transparent}
.lrow:hover{background:var(--weekend)}
.lrow.sel{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.lrow.off .lname,.lrow.off .lic{opacity:.4}
.lrow.over-top{box-shadow:inset 0 2px 0 var(--accent)} .lrow.over-bot{box-shadow:inset 0 -2px 0 var(--accent)}
.lrow.dragging{opacity:.4}
.lic{flex:none;width:24px;height:24px;border-radius:5px;background:var(--weekend);display:grid;place-items:center;font:600 11px var(--f-mono);color:var(--accent);overflow:hidden}
.lic img{width:100%;height:100%;object-fit:cover}
.lname{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow button{flex:none;border:0;background:none;width:24px;height:24px;border-radius:5px;color:var(--muted);font-size:12px;padding:0}
.lrow button:hover{background:var(--sheet);color:var(--accent)}
.lrow button.act{color:var(--accent)}
.lempty{padding:6px 12px 12px;font-size:13px;color:var(--muted)}
.pats{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.pat{border:1px solid var(--line);border-radius:10px;background:var(--sheet);padding:6px;display:flex;flex-direction:column;gap:6px;text-align:left}
.pat.on{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.pat .pv{height:46px;border-radius:6px;background-color:var(--paper);border:1px solid var(--line);background-repeat:repeat}
.pat span{font-size:12.5px;font-weight:500;padding:0 2px}
.wheelbox{display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--paper)}
.wheelrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.wheel{position:relative;width:180px;height:180px;flex:none;touch-action:none;cursor:crosshair}
.wheel canvas{width:180px;height:180px;border-radius:50%;display:block;box-shadow:0 0 0 1px var(--line)}
.wheel .knob{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.3);pointer-events:none}
.wside{flex:1;min-width:120px;display:flex;flex-direction:column;gap:8px}
.wprev{display:flex;height:44px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.wprev i{flex:1}
.hexin{font:600 13px var(--f-mono);border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:var(--sheet);color:var(--ink);width:100%;box-sizing:border-box;text-transform:uppercase}
.slider{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.slider div{display:flex;justify-content:space-between}
.slider b{font:600 12px var(--f-mono);color:var(--ink);font-weight:600}
.slider input{width:100%;accent-color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
<style id="themeVars"></style>

<div class="app" id="app">
  <header class="top">
    <div class="month"><h1 id="mName">Октябрь</h1><span class="yr" id="mYear">2026</span></div>
    <div class="nav">
      <span class="hint" id="modeHint"></span>
      <button class="btn icon aa" id="setOpen" aria-label="Оформление" title="Оформление">Аа</button>
      <button class="btn icon" id="prev" aria-label="Предыдущий месяц">‹</button>
      <button class="btn" id="today">Сегодня</button>
      <button class="btn icon" id="next" aria-label="Следующий месяц">›</button>
    </div>
  </header>
  <section class="cal" aria-label="Календарь">
    <div class="wk"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>
    <div class="grid" id="grid"></div>
  </section>
</div>

<div class="ws" id="ws" hidden role="dialog" aria-modal="true" aria-label="Рабочее пространство дня">
  <div class="wsbar">
    <button class="btn" id="back">←<span class="backlbl"> Календарь</span></button>
    <div class="wshead">
      <span class="wsdate" id="wsDate"></span>
      <input class="wstitle" id="wsTitle" placeholder="Название дня" aria-label="Название дня">
    </div>
    <span class="status" id="status"></span>
    <button class="btn icon aa" id="setOpen2" aria-label="Оформление" title="Оформление">Аа</button>
    <button class="btn icon" id="dPrev" aria-label="Предыдущий день">‹</button>
    <button class="btn icon" id="dNext" aria-label="Следующий день">›</button>
  </div>
  <div class="board" id="board">
    <div class="plane" id="plane"></div>
    <div class="bhint" id="bhint" hidden>
      <strong>Свободное пространство дня</strong>
      <ul>
        <li><kbd>Правый клик</kbd> — заметка, задачи, картинка, аудио или файл</li>
        <li><kbd>Двойной клик</kbd> — заметка в этом месте</li>
        <li>Зажмите фон и тяните, чтобы двигаться</li>

      <div class="grp">
        <button id="zOut" aria-label="Уменьшить">−</button>
        <button id="zoomv" aria-label="Масштаб 100%">100%</button>
        <button id="zIn" aria-label="Увеличить">+</button>
        <button id="zFit" aria-label="Показать всё" title="Показать всё">⤢</button>
      </div>
      <button class="fab" id="fab" aria-label="Добавить">+</button>
    </div>
  </div>
</div>
<input type="file" id="fileIn" multiple class="sr" tabindex="-1" aria-hidden="true">
<input type="file" id="audioIn" multiple accept="audio/*,.mp3,.m4a,.wav,.ogg,.oga,.opus,.aac,.flac" class="sr" tabindex="-1" aria-hidden="true">
<div class="drop" id="drop" hidden>Отпустите — файл встанет сюда</div>

<script>
const MN=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const MG=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const WD=["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=k=>{const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const uid=()=>Math.random().toString(36).slice(2,10);
const now=new Date();
const S={days:{},views:{},y:now.getFullYear(),m:now.getMonth(),open:null,db:null,assets:null,downloads:null,mode:"local"};
const W={V:{x:0,y:0,z:1},sel:null,last:null,busy:false,pendingPos:null};
const dirty=new Set(),timers={},inflight={};
const DEFW={text:280,todo:280,image:320,file:280,audio:320};

function examples(){
  const t=key(now),d1=new Date(now);d1.setDate(d1.getDate()+2);const d2=new Date(now);d2.setDate(d2.getDate()-3);
  return {
    [t]:{title:"Пример · План MVP",blocks:[
      {id:uid(),type:"text",x:40,y:40,w:300,color:"y",text:"Это пример пространства дня.\nПравый клик по фону — добавить текст, задачи, картинку или файл."},
      {id:uid(),type:"todo",x:380,y:60,w:280,items:[{id:uid(),text:"Сетка календаря",done:true},{id:uid(),text:"Свободный холст",done:true},{id:uid(),text:"Вложения",done:false}]}]},
    [key(d1)]:{title:"Пример · Встреча с дизайнером",blocks:[{id:uid(),type:"text",x:40,y:40,w:280,text:"Обсудить тёмную тему и мобильную версию."}]},
    [key(d2)]:{title:"Пример · Идеи",blocks:[{id:uid(),type:"todo",x:40,y:40,w:260,items:[{id:uid(),text:"Поиск по заметкам",done:false}]}]}
  };
}
function norm(d){(d.blocks||(d.blocks=[])).forEach((b,i)=>{if(b.x==null){b.x=40+(i%2)*340;b.y=40+Math.floor(i/2)*240}if(!b.w)b.w=DEFW[b.type]||280});return d}

/* ---------- storage ---------- */
function lsLoad(){try{const r=localStorage.getItem("tetrad-days");return r?JSON.parse(r):null}catch(e){return null}}
function lsSave(){try{localStorage.setItem("tetrad-days",JSON.stringify(clean(S.days)))}catch(e){toast("Браузеру не хватило места, чтобы сохранить файлы")}}
function cleanDay(d){return {title:d.title||"",updatedAt:Date.now(),blocks:(d.blocks||[]).filter(b=>!b.uploading&&!(S.mode==="cloud"&&(b.type==="image"||b.type==="file"||b.type==="audio")&&!b.assetId)).map(b=>{const c={};for(const x in b)if(x[0]!=="_"&&x!=="localUrl"&&x!=="uploading")c[x]=b[x];return c})}}
function clean(all){const o={};for(const k in all)o[k]=cleanDay(all[k]);return o}
const isEmpty=d=>!d||(!(d.title||"").trim()&&!(d.blocks||[]).length);

function scheduleSave(k){dirty.add(k);clearTimeout(timers[k]);setStatus("Сохраняю…");timers[k]=setTimeout(()=>flush(k),600);renderCal()}
async function flush(k){
  if(inflight[k])await inflight[k];
  if(!dirty.has(k))return;
  dirty.delete(k);
  const d=S.days[k];
  const p=(async()=>{
    if(S.mode==="cloud"){const ref=S.db.doc("days/"+k);if(isEmpty(d))await ref.delete();else await ref.set(cleanDay(d))}
    else{if(isEmpty(d))delete S.days[k];lsSave()}
  })();
  inflight[k]=p;
  try{await p;if(!dirty.size)setStatus(S.mode==="cloud"?"Сохранено":"Сохранено в этом браузере")}
  catch(e){dirty.add(k);setStatus("Не сохранено — измените что-нибудь, чтобы повторить",true)}
  finally{inflight[k]=null}
}
function setStatus(t,err){const s=$("status");s.textContent=t;s.classList.toggle("err",!!err)}
function day(k){return S.days[k]||(S.days[k]={title:"",blocks:[]})}

/* ---------- calendar ---------- */
function renderCal(){
  $("mName").textContent=MN[S.m];$("mYear").textContent=S.y;
  const first=new Date(S.y,S.m,1),off=(first.getDay()+6)%7,start=new Date(S.y,S.m,1-off),tk=key(new Date());
  const g=$("grid");g.textContent="";
  for(let i=0;i<42;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);const k=key(d),data=S.days[k];
    const b=document.createElement("button");b.className="cell";
    if(d.getMonth()!==S.m)b.classList.add("out");
    if(d.getDay()===0||d.getDay()===6)b.classList.add("we");
    if(k===tk)b.classList.add("today");
    b.setAttribute("aria-label",d.getDate()+" "+MG[d.getMonth()]+(data&&!isEmpty(data)?", есть записи":""));
    b.append(el("span","num",d.getDate()));
    if(data&&!isEmpty(data)){
      b.classList.add("filled");
      const bl=data.blocks||[];const txt=(data.title||"").trim()||((bl.find(x=>x.type==="text"&&(x.text||"").trim())||{}).text||"").split("\n")[0];
      if(txt)b.append(el("span","peek",txt));
      const img=bl.find(x=>x.type==="image"&&src(x));
      if(img){const t=el("img","thumb");t.alt="";t.src=src(img);b.append(t)}
      const ch=el("span","chips");
      const ni=bl.filter(x=>x.type==="image").length,nf=bl.filter(x=>x.type==="file").length,nt=bl.filter(x=>x.type==="text").length;
      const items=bl.filter(x=>x.type==="todo").flatMap(x=>x.items||[]);
      if(items.length)ch.append(el("span","chip","✓ "+items.filter(x=>x.done).length+"/"+items.length));
      if(nt>1)ch.append(el("span","chip","¶ "+nt));
      if(ni)ch.append(el("span","chip","▣ "+ni));{const na=bl.filter(x=>x.type==="audio").length;if(na)ch.append(el("span","chip","♪ "+na))}if(nf)ch.append(el("span","chip","⎙ "+nf));
      if(ch.childNodes.length)b.append(ch);
    }
    b.onclick=()=>openDay(k);
    g.append(b);
  }
}
function src(b){return b.assetId&&!b.wrapped?"/_blob/"+b.assetId:(b.dataUrl||b.localUrl||"")}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

/* ---------- workspace: view ---------- */
const board=$("board"),plane=$("plane");
function applyView(){const V=W.V;plane.style.transform=`translate(${V.x}px,${V.y}px) scale(${V.z})`;
  paintPattern();board.style.backgroundPosition=`${V.x}px ${V.y}px`;
  $("zoomv").textContent=Math.round(V.z*100)+"%";if(S.open)S.views[S.open]={...V}}
function toCanvas(cx,cy){const r=board.getBoundingClientRect();return {x:Math.round((cx-r.left-W.V.x)/W.V.z),y:Math.round((cy-r.top-W.V.y)/W.V.z)}}
function centerPos(){const r=board.getBoundingClientRect();const p=toCanvas(r.left+r.width/2,r.top+r.height/2);return {x:p.x-130,y:p.y-60}}
function zoomAt(f,cx,cy){const r=board.getBoundingClientRect(),V=W.V;const nz=Math.min(2.5,Math.max(.2,V.z*f));const px=cx-r.left,py=cy-r.top;
  V.x=px-(px-V.x)*nz/V.z;V.y=py-(py-V.y)*nz/V.z;V.z=nz;applyView()}
function zoomCenter(f){const r=board.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
function fit(){
  const nodes=[...plane.querySelectorAll(".it:not([hidden])")];const r=board.getBoundingClientRect();
  if(!nodes.length){W.V={x:Math.min(80,r.width*.08),y:Math.min(170,r.height*.25),z:1};applyView();return}
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  nodes.forEach(n=>{const x=n.offsetLeft,y=n.offsetTop;x1=Math.min(x1,x);y1=Math.min(y1,y);x2=Math.max(x2,x+n.offsetWidth);y2=Math.max(y2,y+n.offsetHeight)});
  const z=Math.max(.2,Math.min(1,(r.width-80)/(x2-x1||1),(r.height-110)/(y2-y1||1)));
  W.V={z,x:(r.width-(x2-x1)*z)/2-x1*z,y:Math.max(30,(r.height-(y2-y1)*z)/2)-y1*z};applyView();
}

/* ---------- workspace: open/close ---------- */
function openDay(k){
  S.open=k;const d=parse(k);
  if(d.getMonth()!==S.m||d.getFullYear()!==S.y){S.y=d.getFullYear();S.m=d.getMonth();renderCal()}
  try{history.replaceState(null,"","#d"+k)}catch(e){}
  $("ws").hidden=false;document.body.style.overflow="hidden";
  setStatus(S.mode==="cloud"?"Сохраняется автоматически":"Сохраняется в этом браузере");
  $("wsDate").textContent=d.getDate()+" "+MG[d.getMonth()]+" "+d.getFullYear()+" · "+WD[d.getDay()];
  select(null);renderWs();
  if(S.views[k]){W.V={...S.views[k]};applyView()}else fit();
}
function closeDay(){closeMenu();$("layers")?.remove();S.open=null;$("ws").hidden=true;document.body.style.overflow="";try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}renderCal()}
function shiftDay(n){const d=parse(S.open);d.setDate(d.getDate()+n);openDay(key(d))}

function renderWs(){
  const k=S.open,data=norm(S.days[k]||{title:"",blocks:[]}),d=parse(k);
  const t=$("wsTitle");if(document.activeElement!==t)t.value=data.title||"";
  plane.textContent="";
  plane.append(el("div","bignum",pad(d.getDate())+"."+pad(d.getMonth()+1)));
  data.blocks.forEach(b=>plane.append(renderItem(b)));
  renderLayers();
  plane.querySelectorAll("textarea.txt").forEach(grow);
  $("bhint").hidden=data.blocks.length>0;
}
$("wsTitle").oninput=e=>{day(S.open).title=e.target.value;scheduleSave(S.open)};

function grow(t){t.style.height="auto";t.style.height=t.scrollHeight+"px"}
function findB(id){return (S.days[S.open]?.blocks||[]).find(b=>b.id===id)}
function nodeOf(id){return plane.querySelector(`.it[data-id="${id}"]`)}
function rerender(b,focusId){const o=nodeOf(b.id),n=renderItem(b);if(o)o.replaceWith(n);else plane.append(n);n.querySelectorAll("textarea.txt").forEach(grow);
  renderLayers();if(focusId){const f=document.getElementById(focusId);f&&f.focus()}$("bhint").hidden=!!(S.days[S.open]?.blocks||[]).length}
function select(id){W.sel=id;document.querySelectorAll(".lrow").forEach(r=>r.classList.toggle("sel",r.dataset.id===id));plane.querySelectorAll(".it.sel").forEach(n=>n.classList.remove("sel"));if(id){const n=nodeOf(id);n&&n.classList.add("sel")}}

/* ---------- workspace: items ---------- */
function renderItem(b){
  const k=S.open;
  const n=el("div","it"+(b.color?" c-"+b.color:"")+(b.uploading?" uploading":"")+(W.sel===b.id?" sel":""));
  n.dataset.id=b.id;n.style.left=b.x+"px";n.style.top=b.y+"px";n.style.width=b.w+"px";
  if(b.font&&FONTS[b.font]){n.style.setProperty("--nf",FONTS[b.font].css);n.style.setProperty("--nk",FONTS[b.font].k)}
  if(b.fs&&SIZES[b.fs])n.style.setProperty("--ns",SIZES[b.fs]+"px");
  if(b.type==="text"){
    n.append(el("div","grip","Заметка"));
    const bd=el("div","body");const t=el("textarea","txt");t.id="t-"+b.id;t.placeholder="Пишите здесь…";t.value=b.text||"";t.setAttribute("aria-label","Заметка");
    t.oninput=()=>{b.text=t.value;grow(t);scheduleSave(k)};bd.append(t);n.append(bd);
  } else if(b.type==="todo"){
    const items=b.items||(b.items=[]);
    n.append(el("div","grip","Задачи "+items.filter(x=>x.done).length+"/"+items.length));
    const bd=el("div","body todo");
    items.forEach((it,j)=>{
      const r=el("div","ti"+(it.done?" done":""));
      const c=el("input");c.type="checkbox";c.checked=it.done;c.id="c-"+it.id;c.setAttribute("aria-label","Готово");
      c.onchange=()=>{it.done=c.checked;rerender(b);scheduleSave(k)};
      const tx=el("input");tx.type="text";tx.id="i-"+it.id;tx.value=it.text;tx.placeholder="Задача";
      tx.oninput=()=>{it.text=tx.value;scheduleSave(k)};
      tx.onkeydown=e=>{
        if(e.key==="Enter"){e.preventDefault();const ni={id:uid(),text:"",done:false};items.splice(j+1,0,ni);rerender(b,"i-"+ni.id);scheduleSave(k)}
        if(e.key==="Backspace"&&!tx.value&&items.length>1){e.preventDefault();items.splice(j,1);rerender(b,"i-"+items[Math.max(0,j-1)].id);scheduleSave(k)}
      };
      const x=el("button","x","✕");x.setAttribute("aria-label","Удалить задачу");x.onclick=()=>{items.splice(j,1);rerender(b);scheduleSave(k)};
      r.append(c,tx,x);bd.append(r);
    });
    const add=el("button","addi","+ задача");add.onclick=()=>{const ni={id:uid(),text:"",done:false};items.push(ni);rerender(b,"i-"+ni.id);scheduleSave(k)};
    bd.append(add);n.append(bd);
  } else if(b.type==="image"){
    const w=el("div","imgw");const im=el("img");im.alt=b.caption||b.name||"Картинка";im.src=src(b);im.draggable=false;
    im.onerror=()=>{if(!b.uploading){w.textContent="";w.append(el("div","note","Картинка недоступна в этом окне"))}};
    w.append(im);
    const cp=el("input","cap");cp.id="cap-"+b.id;cp.placeholder="Подпись";cp.value=b.caption||"";cp.setAttribute("aria-label","Подпись к картинке");
    cp.oninput=()=>{b.caption=cp.value;scheduleSave(k)};w.append(cp);
    if(!b.assetId&&!b.dataUrl&&!b.uploading)w.append(el("div","note","Видна до перезагрузки: постоянное хранение файлов работает в Claude"));
    n.append(w);
  } else if(b.type==="audio"){
    n.append(renderAudio(b));
  } else if(b.type==="file"){
    const w=el("div","filew");
    const ext=((b.name||"").includes(".")?(b.name||"").split(".").pop():"файл").slice(0,4);
    w.append(el("div","ext",ext));
    const m=el("div","fmeta");m.append(el("div","fname",b.name),el("div","fsize",size(b.size)));
    const a=el("div","fact");
    if(!b.uploading){
      const dl=el("button",null,"Скачать");dl.onclick=()=>download(b);a.append(dl);
      if(b.assetId&&!b.wrapped){const o=el("a",null,"Открыть ↗");o.href="/_blob/"+b.assetId;o.target="_blank";o.rel="noopener";a.append(o)}
    }
    m.append(a);w.append(m);n.append(w);
  }
  n.append(el("div","rz"));
  if(b.locked){n.classList.add("locked");n.append(el("span","lockb","🔒"))}
  if(b.hidden)n.hidden=true;
  attachDrag(n,b);
  return n;
}
function size(n){if(n==null)return"";return n<1024?n+" Б":n<1048576?(n/1024).toFixed(0)+" КБ":(n/1048576).toFixed(1)+" МБ"}

function attachDrag(n,b){
  n.addEventListener("pointerdown",e=>{
    if(e.button!==0)return;
    closeMenu();select(b.id);
    const t=e.target;
    if(t.closest("input,textarea,button,a,.wave"))return;
    if(b.locked)return;
    const resize=t.classList.contains("rz");
    e.preventDefault();e.stopPropagation();
    if(document.activeElement&&document.activeElement!==document.body&&n.contains(document.activeElement)===false)document.activeElement.blur();
    n.setPointerCapture(e.pointerId);W.busy=true;n.classList.add("drag");
    const sx=e.clientX,sy=e.clientY,ox=b.x,oy=b.y,ow=b.w;let moved=false;
    const mv=ev=>{const dx=(ev.clientX-sx)/W.V.z,dy=(ev.clientY-sy)/W.V.z;if(Math.abs(dx)+Math.abs(dy)>2)moved=true;
      if(resize){b.w=Math.max(160,Math.round(ow+dx));n.style.width=b.w+"px";n.querySelectorAll("textarea.txt").forEach(grow)}

const DIRECT=/^(image\/(png|jpeg|gif|webp|svg\+xml)|application\/pdf|video\/(mp4|webm))$/;
const SHOWABLE=/^image\/(png|jpeg|gif|webp|svg\+xml)$/;
function readB64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const s=String(r.result);res(s.slice(s.indexOf(",")+1))};r.onerror=()=>rej(r.error);r.readAsDataURL(f)})}

function errText(e,f){
  const c=e&&e.code;
  if(c==="too_large")return "«"+f.name+"» больше 20 МБ";
  if(c==="too_large_wrapped")return "Файлы такого типа можно загружать до 15 МБ — «"+f.name+"» больше";
  if(c==="quota_or_state")return "Закончилось место для файлов. Удалите ненужные вложения";
  if(c==="rate_limited")return "Слишком много загрузок подряд. Подождите минуту";
  if(c==="upstream_auth")return "Нужно заново войти: перезагрузите страницу";
  if(c==="not_granted"||c==="capability_disabled"||c==="capability_removed")return "Загрузка файлов недоступна в этом окне";
  return "Не удалось загрузить «"+f.name+"». Попробуйте ещё раз";
}
async function uploadSmart(f,b){
  if(DIRECT.test(f.type)){
    try{const r=await S.assets.upload(f);b.assetId=r.id;return}
    catch(e){const c=e&&e.code;if(c!=="unsupported_type"&&c!=="invalid_request")throw e;b.type="file"}
  }
  // Other types: stored as base64 text, decoded back on download
  if(f.size>15*1024*1024)throw {code:"too_large_wrapped"};
  const txt=await readB64(f);
  const r=await S.assets.upload(new Blob([txt],{type:"text/plain"}),{type:"text/plain"});
  b.assetId=r.id;b.wrapped=true;
}
async function handleFiles(list,pos){
  const k=S.open;if(!k||!list.length)return;
  pos=pos||centerPos();
  for(let i=0;i<list.length;i++){
    const f=list[i];
    if(f.size>20*1024*1024){toast("«"+f.name+"» больше 20 МБ");continue}
    const show=SHOWABLE.test(f.type),amime=audioMime(f);
    const b=addItem({type:amime?"audio":show?"image":"file",name:f.name,size:f.size,mime:amime||f.type||"",uploading:true,localUrl:show?URL.createObjectURL(f):"",_file:f},{x:pos.x+i*28,y:pos.y+i*28});
    rerender(b);
    try{
      if(amime){
        if(f.size>15*1024*1024)throw {code:"too_large_wrapped"};
        const txt=await readB64(f);b._url="data:"+amime+";base64,"+txt;
        if(S.assets){const r=await S.assets.upload(new Blob([txt],{type:"text/plain"}),{type:"text/plain"});b.assetId=r.id;b.wrapped=true}
        else if(f.size<1.5*1024*1024)b.dataUrl=b._url;
      }
      else if(S.assets)await uploadSmart(f,b);
      else if(f.size<1.5*1024*1024){try{b.dataUrl="data:"+(f.type||"application/octet-stream")+";base64,"+await readB64(f)}catch(e){}}
      delete b.uploading;
    }catch(e){
      toast(errText(e,f));const bl=day(k).blocks;const j=bl.indexOf(b);if(j>=0)bl.splice(j,1);const n=nodeOf(b.id);n&&n.remove();
      $("bhint").hidden=bl.length>0;continue;
    }
    if(S.open===k)rerender(b);scheduleSave(k);
  }
}
async function getBlob(b){
  if(b._file)return b._file;
  if(b.dataUrl){const s=b.dataUrl;return b64ToBlob(s.slice(s.indexOf(",")+1),b.mime)}
  const r=await fetch("/_blob/"+b.assetId);if(!r.ok)throw new Error("not_found");
  return b.wrapped?b64ToBlob(await r.text(),b.mime):await r.blob();
}
async function download(b){
  if(!S.downloads){
    if(b.assetId&&!b.wrapped){window.open("/_blob/"+b.assetId,"_blank");return}
    toast("Скачивание работает, когда страница открыта в Claude");return;
  }
  try{await S.downloads.save({filename:b.name||"файл",data:await getBlob(b)})}
  catch(e){const c=e&&e.code;if(c==="declined")return;
    toast(c==="rejected_extension"?"Файлы с таким расширением скачивать нельзя":c==="rate_limited"?"Слишком часто. Попробуйте через минуту":"Не удалось подготовить файл к скачиванию")}
}

/* ---------- ui bits ---------- */
function lightbox(s){if(!s)return;const o=el("div","lb");const im=el("img");im.src=s;im.alt="";o.append(im);o.onclick=()=>o.remove();document.body.append(o)}
let toastEl=null,toastT=null;
function toast(msg,action,ms=4500){hideToast();toastEl=el("div","toast");toastEl.setAttribute("role","status");toastEl.append(el("span",null,msg));
  if(action){const b=el("button",null,action[0]);b.onclick=action[1];toastEl.append(b)}document.body.append(toastEl);toastT=setTimeout(hideToast,ms)}
function hideToast(){clearTimeout(toastT);if(toastEl){toastEl.remove();toastEl=null}}

$("prev").onclick=()=>{S.m--;if(S.m<0){S.m=11;S.y--}renderCal()};
$("next").onclick=()=>{S.m++;if(S.m>11){S.m=0;S.y++}renderCal()};
$("today").onclick=()=>{const t=new Date();S.y=t.getFullYear();S.m=t.getMonth();renderCal()};
$("back").onclick=closeDay;$("dPrev").onclick=()=>shiftDay(-1);$("dNext").onclick=()=>shiftDay(1);
addEventListener("keydown",e=>{
  const typing=/INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if(e.key==="Escape"){const lb=document.querySelector(".lb");if(lb){lb.remove();return}if(menu){closeMenu();return}if($("set")){closeSettings();return}if(typing){document.activeElement.blur();return}if(S.open){if(W.sel)select(null);else closeDay()}return}
  if(S.open&&!typing&&W.sel&&(e.key==="Delete"||e.key==="Backspace")){e.preventDefault();const lb=findB(W.sel);if(lb&&lb.locked){toast("Элемент заблокирован — сначала разблокируйте его");return}removeItem(W.sel);return}
  if(S.open&&!typing&&W.sel&&(e.ctrlKey||e.metaKey)&&(e.code==="BracketRight"||e.code==="BracketLeft")){e.preventDefault();const b=findB(W.sel);if(!b)return;
    if(e.code==="BracketRight")(e.shiftKey?front:up1)(b);else(e.shiftKey?back:down1)(b);return}
  if(S.open&&!typing&&!e.ctrlKey&&!e.metaKey&&e.code==="KeyL"){toggleLayers();return}
  if(!S.open&&!typing){if(e.key==="ArrowLeft")$("prev").click();if(e.key==="ArrowRight")$("next").click()}
});
addEventListener("resize",closeMenu);

/* ---------- boot ---------- */
applyPrefs();
S.days=lsLoad()||examples();
renderCal();
const h=(location.hash||"").match(/^#d(\d{4}-\d{2}-\d{2})$/);if(h)openDay(h[1]);

(async()=>{
  if(!window.claude||!claude.use)return;
  const db=await claude.use("db");
  if(!db){$("modeHint").textContent="Сохраняется только в этом браузере";return}
  S.db=db;S.mode="cloud";
  if(S.open)setStatus("Сохраняется автоматически");
  S.assets=await claude.use("assets");
  loadCloudPrefs(db);
  claude.use("downloads").then(d=>{S.downloads=d});
  let firstSnap=true;
  db.collection("days").onSnapshot(snap=>{
    if(firstSnap){S.days={};firstSnap=false}
    let touchedOpen=false;
    for(const ch of snap.docChanges()){
      const id=ch.doc.id;if(dirty.has(id)||inflight[id])continue;
      if(id===S.open&&(W.busy||plane.querySelector(".uploading")))continue;
      if(ch.type==="removed")delete S.days[id];else S.days[id]=JSON.parse(JSON.stringify(ch.doc.data()));
      if(id===S.open)touchedOpen=true;
    }
    renderCal();
    if(S.open&&touchedOpen&&!$("ws").contains(document.activeElement)){const fresh=!S.views[S.open];renderWs();if(fresh)fit()}
  },e=>{$("modeHint").textContent="Нет связи с хранилищем"});
})();
</script>
